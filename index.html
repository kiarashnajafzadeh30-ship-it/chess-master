<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شطرنج حرفه‌ای آنلاین</title>
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>♟️ شطرنج حرفه‌ای ♟️</h1>
    
    <!-- انتخاب حالت بازی -->
    <div class="mode-selector">
      <label>حالت بازی:</label>
      <select id="gameMode" onchange="changeMode()">
        <option value="pvp">بازی با دوست (همین دستگاه) 👥</option>
        <option value="pve">بازی با ربات 🤖</option>
        <option value="online">بازی آنلاین (دو دستگاه) 🌐</option>
      </select>
    </div>

    <!-- بخش آنلاین (اول مخفیه) -->
    <div id="online-section" style="display: none;">
      <div class="online-controls">
        <button onclick="createRoom()">ساخت اتاق (میزبان) 🏠</button>
        <div class="join-group">
          <input type="text" id="roomCodeInput" placeholder="کد اتاق را وارد کنید...">
          <button onclick="joinRoom()">اتصال (مهمان) 🔗</button>
        </div>
      </div>
      <div id="roomCodeDisplay" class="room-code-text"></div>
    </div>

    <div class="player-inputs">
      <div>
        <label>بازیکن سفید ⚪</label>
        <input type="text" id="whitePlayerName" placeholder="اسم سفید...">
      </div>
      <div>
        <label>بازیکن سیاه ⚫</label>
        <input type="text" id="blackPlayerName" placeholder="اسم سیاه...">
      </div>
    </div>

    <div class="controls">
      <button onclick="restartGame()">شروع مجدد 🔄</button>
      <button onclick="flipBoard()">چرخوندن صفحه 🔃</button>
    </div>

    <!-- سایز صفحه بزرگتر شد (500px) -->
    <div id="myBoard" style="width: 500px; margin: 0 auto;"></div>
    
    <div id="status"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <!-- کتابخانه اتصال آنلاین (PeerJS) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
